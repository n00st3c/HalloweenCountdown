<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Countdown Halloween</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="estilos.css">
</head>
<body>
 <h1>Countdown a Halloween</h1>
 <p id="subtitulo">Cuenta atrás hasta el 31 de octubre</p>
 <svg class="calabaza" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="50" cy="50" rx="45" ry="35" fill="#ff6b1a"/>
  <ellipse cx="20" cy="50" rx="20" ry="32" fill="#ff6b1a" opacity="0.85"/>
  <ellipse cx="80" cy="50" rx="20" ry="32" fill="#ff6b1a" opacity="0.85"/>
  <rect x="45" y="8" width="10" height="18" rx="4" fill="#2e7d32"/>
  <path d="M30 45 L40 55 L30 65 Z" fill="#0d0221"/>
  <path d="M70 45 L60 55 L70 65 Z" fill="#0d0221"/>
  <path d="M28 72 Q50 90 72 72 L64 68 Q50 78 36 68 Z" fill="#0d0221"/>
</svg>
<div id="contador">
  <div class="lapida">
    <div class="numero" id="dias">00</div>
    <div class="etiqueta">días</div>
  </div>
  <div class="lapida">
    <div class="numero" id="horas">00</div>
    <div class="etiqueta">horas</div>
    </div>
        <div class="lapida">
        <div class="numero" id="minutos">00</div>
        <div class="etiqueta">minutos</div>
    </div>
      <div class="lapida">
        <div class="numero" id="segundos">00</div>
        <div class="etiqueta">segundos</div>
    </div>
</div>

<p id="mensajeFase"></p>
<script src="script.js"></script>
</body>
</html>
